[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ballistiq"
version = "1.1.0"
description = "Marca un objeto frame a frame en un vídeo y exporta sus píxeles a Excel."
readme = "README.md"
requires-python = ">=3.8,<3.15"

# El máximo de cada rango es la última versión probada: una versión nueva de una
# librería no puede romper una instalación. El rango permite que pip elija la más
# reciente que exista para cada sistema, lo que amplía mucho dónde se puede instalar
# (por ejemplo, av 19 solo existe para Mac Apple Silicon con macOS 14 o superior).
dependencies = [
    "PyQt6>=6.7,<=6.12.0",
    "PyQt6-Qt6>=6.7,<=6.12.0",
    "PyQt6-sip>=13.6,<=13.13.0",
    "av>=12.3,<=19.0.2",
    "numpy>=1.24,<=2.5.4",
    "openpyxl>=3.1,<=3.1.5",
    "et-xmlfile<=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
ballistiq = "ballistiq:main"

[tool.setuptools]
py-modules = ["ballistiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
